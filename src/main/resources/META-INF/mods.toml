loaderVersion = "[36,)"
#issueTrackerURL = ""
license = "LGPL-v3"

[[mods]]
modId = "modernemb"
version = "${version}"
displayName = "ModernEmb"
authors = "Kasualix"
#credits = ""
description = '''
A Modern UI remake of the Embeddium configuration screens.

Every option keeps its original config model and bindings, so switches, sliders and lists behave exactly like the mod they belong to. Embeddium pages added by other mods are grouped by their source mod, and Oculus shader settings can be edited from the same screen.

ModernEmb also adds its own appearance page through Embeddium's OptionPage API: color schemes, navigation-bar styles and NarutoUI shimmer effects, including a two-color shimmer band interpolated in OKLab.

Client-side only. Requires Modern UI, NarutoUI and Embeddium; Configured and Oculus support is optional.
'''
#logoFile = ""

